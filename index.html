<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./build/css/app.css">
</head>

<body>
    <header>
        <h1>Calculadora de Operaciones Matemáticas</h1>
    </header>
    <main>
        <section class="calculator">
            <div class="input_text-container">
                <input size="1" id="operation-input" class="calculator-input" type="text"
                    placeholder="Ingresa la operación...">
                <input size="1" id="result-input" class="calculator-input" type="text" placeholder="Respuesta" disabled>
            </div>
            <div class="input_button-container">
                <div class="numbers-container"></div>
                <div class="operations-container"></div>
            </div>
        </section>
    </main>
    <footer>
        <p>Calculadora de Operaciones Matemáticas ©. Todos los derechos reservados.</p>
    </footer>
    <script src="./build/js/app.js"></script>
</body>

</html>
